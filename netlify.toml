# إعداد Netlify — التطبيق الكامل مجانًا
# ------------------------------------------------------------
# الصفحات و/api تعمل داخل Netlify Function (`server`) مع Express،
# والبيانات الدائمة في Netlify Blobs بدل القرص (لا Render ولا بطاقة).
# الأصول الثابتة تبقى على CDN. المجدول الدوري يعمل عبر Scheduled Function.
# اختياري: BACKEND_ORIGIN يوجّه الطلبات إلى Render/Railway بدل الدالة.
# التفاصيل في DEPLOY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  included_files = [
    "public/build.json",
    "server/features/routines/systems/**",
    "server/features/routines/library/**",
  ]

[[edge_functions]]
  function = "proxy"
  path = "/*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
